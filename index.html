<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Рік психології</title>
<meta name="theme-color" content="#2F5D62">
<meta name="description" content="Особиста навчальна програма з психології: модулі, матеріали, картки, календар і статистика навчання.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Рік психології">
<link rel="manifest" id="app-manifest">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Source+Serif+4:wght@500;600&display=swap">
<style>
/* Макет: ліва навігація зі списком модулів і колонка для читання; на «Огляді» в центрі годинник року з 12 секторів, що заповнюються від центру. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface-2:#E3ECE9; --ink:#10201E; --ink-2:#496360;
  --line:#D2DEDB; --line-strong:#93AAA6; --accent:#0A7B6D; --accent-ink:#FFFFFF; --accent-soft:#D3EDE8;
  --warm:#C9741A; --warm-soft:#FBEBD6; --warm-ink:#7F4308;
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1514; --surface:#13201F; --surface-2:#1C2E2C; --ink:#E4EFEC; --ink-2:#9BB2AE;
    --line:#243B38; --line-strong:#4A6A66; --accent:#4FD0BA; --accent-ink:#04211D; --accent-soft:#143F39;
    --warm:#F0A24F; --warm-soft:#3A2A14; --warm-ink:#F6BF80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1514; --surface:#13201F; --surface-2:#1C2E2C; --ink:#E4EFEC; --ink-2:#9BB2AE;
  --line:#243B38; --line-strong:#4A6A66; --accent:#4FD0BA; --accent-ink:#04211D; --accent-soft:#143F39;
  --warm:#F0A24F; --warm-soft:#3A2A14; --warm-ink:#F6BF80; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.shell{display:grid;grid-template-columns:272px minmax(0,1fr);column-gap:44px;max-width:1260px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.side{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:26px 0 24px;scrollbar-width:thin;min-width:0}
.brand{display:block;text-decoration:none;color:var(--ink);padding:0 10px 6px}
.brand b{font-family:var(--font-display);font-weight:600;font-size:1.05rem;display:block}
.brand span{font-size:.8rem;color:var(--ink-2)}
.nav-label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:20px 10px 6px}
.nav{display:grid;gap:1px}
.nav a{display:grid;grid-template-columns:26px minmax(0,1fr) 20px;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.9rem;line-height:1.3}
.nav a.plain{grid-template-columns:minmax(0,1fr)}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.nav .n{font-family:var(--font-display);font-size:.72rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dot{--p:0;width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--surface-2) 0);position:relative}
.dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.nav a[aria-current="page"] .dot::after{background:var(--accent-soft)}
.dot.full{background:var(--accent)}
.dot.full::after{inset:auto;left:7px;top:3.5px;width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg);background:none;border-radius:0}
.sync{font-size:.78rem;color:var(--ink-2);padding:0 10px;margin-top:22px}
.sync[data-s="cloud"]::before,.sync[data-s="saving"]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.sync[data-s="saving"]::before{background:var(--warm)}
.pill{display:inline-flex;align-items:center;gap:6px;margin:14px 10px 0;padding:6px 12px;border-radius:99px;background:var(--warm-soft);color:var(--warm-ink);font-size:.85rem;font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums}
.pill[hidden]{display:none!important}

.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.topbar .pill{margin:0}
.topbar .t{font-family:var(--font-display);font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink)}
.menu-btn,.close-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.close-btn{display:none;margin:0 10px 10px auto}

.main{min-width:0;padding-top:34px}
.page{max-width:760px}
.page.wide{max-width:none}
.eyebrow{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:10px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.2}
.lead{font-size:1.08rem;color:var(--ink-2);margin-top:14px;max-width:62ch}
.meta{font-size:.88rem;color:var(--ink-2);margin-top:14px}
.meta span+span::before{content:"·";margin:0 8px}
.sec{margin-top:38px}
.sec>h2,.finish>h2{font-size:1.15rem;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec>h2 small{font-weight:500;color:var(--ink-2);font-size:.85rem;white-space:nowrap}
.sub{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:18px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 18px}
.card.pad{padding:18px}
.callout{background:var(--accent-soft);border-radius:14px;padding:14px 18px;margin-top:22px}
.callout b{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}
.note{background:var(--warm-soft);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:.92rem;margin-top:22px}
.note a{color:var(--warm-ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{min-height:34px;padding:0 12px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.chk{display:flex;gap:14px;align-items:flex-start;padding:12px 0;cursor:pointer}
.card .chk+.chk{border-top:1px solid var(--line)}
.cb{appearance:none;-webkit-appearance:none;margin:2px 0 0;width:22px;height:22px;flex:none;border:1.5px solid var(--line-strong);border-radius:7px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk .lbl{min-width:0}
.chk:has(.cb:checked) .lbl{color:var(--ink-2)}

.res-group+.res-group{margin-top:6px}
.tgs{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0}
.tg{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.res{display:grid;gap:2px;padding:12px 0}
.card .res+.res{border-top:1px solid var(--line)}
.res a{font-weight:600;overflow-wrap:anywhere}
.res .nolink{font-weight:600}
.res span{font-size:.9rem;color:var(--ink-2)}

.ta{display:block;width:100%;min-height:110px;resize:vertical;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit;line-height:1.55}
.ta:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.inp{width:100%;min-height:42px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.hint{font-size:.85rem;color:var(--ink-2);margin-top:8px}
.part{margin-top:16px}
.part label.pl{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.wc{font-size:.8rem;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}

.finish{margin-top:40px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.reqs{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:10px}
.reqs li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:block;position:relative}
.reqs li.ok .tick{background:var(--accent);border-color:var(--accent)}
.reqs li.ok .tick::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.reqs .x{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.doneline{font-weight:700;color:var(--accent);margin-bottom:12px}
.pn{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:36px}
.pn a{display:grid;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink);min-width:0;flex:1 1 220px}
.pn a:hover{border-color:var(--ink-2)}
.pn small{color:var(--ink-2);font-size:.78rem}
.pn a.next{text-align:right}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,350px);gap:36px;align-items:center;padding-bottom:30px}
.hero .cta{margin-top:22px}
.quiet{font-size:.9rem;color:var(--ink-2);margin-top:16px}
.ring{width:100%;max-width:350px;height:auto;display:block;margin-inline:auto;overflow:visible}
.seg{cursor:pointer;outline:none}
.seg .t{fill:var(--surface-2);stroke:var(--surface-2);stroke-width:1;stroke-linejoin:round}
.seg:hover .t,.seg:focus-visible .t{fill:var(--accent-soft);stroke:var(--accent-soft)}
.seg .f{fill:var(--accent);stroke:var(--accent);stroke-width:1;stroke-linejoin:round}
.seg .c{fill:none;stroke:var(--warm);stroke-width:2.5;stroke-linejoin:round}
.seg:focus-visible .c2{fill:none;stroke:var(--ink);stroke-width:2}
.ring text{font-family:var(--font-body);text-anchor:middle;dominant-baseline:central}
.ring .rn{font-size:11px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.ring .rn.cur{fill:var(--warm-ink);font-weight:700}
.ring .big{font-family:var(--font-display);font-size:38px;font-weight:600;fill:var(--ink)}
.ring .cap{font-size:11px;fill:var(--ink-2)}
.legend{font-size:.8rem;color:var(--ink-2);text-align:center;margin-top:10px}
.pace{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:end;justify-content:space-between;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pace .msg{flex:1 1 320px;min-width:0}
.pace .msg b{display:block;margin-bottom:2px}
.pace label{display:grid;gap:4px;font-size:.8rem;color:var(--ink-2);font-weight:600}
.pace input{min-width:170px}
.road{border-top:1px solid var(--line);margin-top:6px}
.road a{display:grid;grid-template-columns:44px minmax(0,1fr) 150px;gap:6px 16px;padding:16px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);align-items:start}
.road a:hover{background:var(--surface)}
.road .num{font-family:var(--font-display);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.road .tt{font-weight:600}
.road .gg{font-size:.88rem;color:var(--ink-2);margin-top:2px}
.road .bar{margin-top:10px}
.road .mt{font-size:.82rem;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.road .mt b{display:block;color:var(--ink);font-size:.95rem}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.quote{margin:40px 0 0;padding:0;font-size:1.12rem;line-height:1.6;max-width:60ch;color:var(--ink)}
.quote cite{display:block;font-style:normal;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;font-weight:600}

.today{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.today .what{font-size:1.15rem;font-weight:700;margin-top:4px}
.timer{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;margin-top:20px}
.tm-time{font-family:var(--font-display);font-weight:600;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;font-variant-numeric:tabular-nums}
.seg-btns{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wk{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.wk li{display:grid;grid-template-columns:104px minmax(0,1fr) 84px 96px;gap:6px 14px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--line)}
.wk li.now{background:var(--surface)}
.wk .dn{font-weight:700}
.wk .dn small{display:block;font-weight:500;color:var(--ink-2);font-size:.78rem}
.wk .pl{font-size:.88rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wk .bar{margin-top:8px}
.wk .inp{min-height:38px;text-align:right;font-variant-numeric:tabular-nums}
.wk .un{font-size:.75rem;color:var(--ink-2)}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--warm);color:var(--bg);padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}

.gl-form{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) 200px}
.gl-form .full{grid-column:1/-1}
.gl-item{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.gl-item b{font-size:1.02rem}
.gl-item p{color:var(--ink-2);margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.gl-item .m{font-size:.8rem;color:var(--ink-2);margin-top:6px}
.topic-extra{margin:0 0 12px 36px;padding:10px 12px;border-left:2px solid var(--line);background:var(--bg);border-radius:0 10px 10px 0}
.topic-extra summary{cursor:pointer;color:var(--ink-2);font-size:.85rem;font-weight:600}
.topic-extra .ta{margin-top:9px;min-height:76px}
.material-form{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) 170px}
.material-form .full{grid-column:1/-1}
.material-item{padding:14px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.material-item a{font-weight:600;overflow-wrap:anywhere}
.material-item p{font-size:.9rem;color:var(--ink-2);margin-top:3px;white-space:pre-wrap}
.material-item .m{font-size:.8rem;color:var(--ink-2);margin-top:5px}
@media(max-width:760px){.material-form{grid-template-columns:minmax(0,1fr)}}

.empty{padding:28px 18px;border:1px dashed var(--line-strong);border-radius:14px;color:var(--ink-2);text-align:center}
.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:grid;gap:10px}
.rules li{counter-increment:r;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rules li::before{content:counter(r);font-family:var(--font-display);font-weight:600;color:var(--accent)}
dl.tpl{margin:0;display:grid;gap:10px}
dl.tpl div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 16px}
dl.tpl dt{font-weight:700}
dl.tpl dd{margin:0;color:var(--ink-2)}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
pre.tree{margin:0;padding:16px 18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.6;white-space:pre}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex}
  .main{padding-top:24px}
  .side{display:none}
  body.nav-open{overflow:hidden}
  body.nav-open .side{display:block;position:fixed;inset:0;z-index:50;max-height:none;background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  body.nav-open .close-btn{display:block}
  .side .pill{display:none}
}
@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr);gap:24px}
  .road a{grid-template-columns:34px minmax(0,1fr)}
  .road .mt{grid-column:2;text-align:left}
  .road .mt b{display:inline;margin-right:8px}
  .wk li{grid-template-columns:minmax(0,1fr) 92px}
  .wk .dn{grid-column:1/-1}
  .wk .pl{grid-column:1}
  .wk .logc{grid-column:2;grid-row:3}
  .wk .wwhat{grid-column:1/-1}
  .gl-form{grid-template-columns:minmax(0,1fr)}
  dl.tpl div{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}

/* ───────── Додаткові навчальні інструменти ───────── */
.resource-card{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:9px}
.resource-card:first-child{border-top:0}
.resource-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.resource-title{font-weight:700;overflow-wrap:anywhere}
.resource-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px}
.resource-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.resource-tools .inp{width:auto;min-width:150px;min-height:36px;font-size:.86rem}
.resource-note{min-height:70px!important}
.resource-video{margin-top:8px;aspect-ratio:16/9;width:100%;border:0;border-radius:10px;background:#000}
.topic-resources{margin:4px 0 13px 36px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}

/* ===== Motion system · tactility, clarity, reduced-motion support ===== */
:root{
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.2,.85,.25,1.25);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --shadow-soft:0 5px 16px rgba(31,35,40,.055);
  --shadow-lift:0 12px 28px rgba(31,35,40,.11),0 3px 8px rgba(31,35,40,.045);
  --motion-fast:160ms;
  --motion-base:240ms;
}

/* Use transform + opacity for motion; colors and shadows stay subtle. */
.btn,.chip,.menu-btn,.close-btn,.nav a,.dlink,.rc-title a,.pn a,
.mstrip a,.concept-node,.cal-day,.topic-extra summary,details>summary,
button,.flashcard,.case-card,.dc,.stat-card,.card.pad,.finish,.today,
.weekly-review,.resource-card,.tool-item,.gl-item,.material-item{
  transition:
    transform var(--motion-base) var(--ease-out),
    box-shadow var(--motion-base) var(--ease-out),
    border-color var(--motion-fast) var(--ease-soft),
    background-color var(--motion-fast) var(--ease-soft),
    color var(--motion-fast) var(--ease-soft),
    opacity var(--motion-base) var(--ease-out);
}

.btn{position:relative;isolation:isolate;transform:translateZ(0);}
.btn.primary{box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 17%,transparent);}
.btn:active,.chip:active,.menu-btn:active,.close-btn:active{transform:scale(.97);}
.btn.primary:active{box-shadow:0 1px 4px color-mix(in srgb,var(--accent) 22%,transparent);}
.btn:focus-visible,.chip:focus-visible,.menu-btn:focus-visible,.close-btn:focus-visible{
  outline:3px solid color-mix(in srgb,var(--accent) 32%,transparent);
  outline-offset:3px;
}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled),.chip:hover:not(:disabled),.menu-btn:hover,.close-btn:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-soft);
  }
  .btn.primary:hover:not(:disabled){
    box-shadow:0 9px 22px color-mix(in srgb,var(--accent) 22%,transparent);
    filter:saturate(1.07);
  }
  .nav a:hover,.pn a:hover,.mstrip a:hover,.rc-title a:hover,.dlink:hover{
    transform:translateX(3px);
  }
  .dc:hover,.stat-card:hover,.flashcard:hover,.case-card:hover,.today:hover,.weekly-review:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-lift);
    border-color:color-mix(in srgb,var(--accent) 28%,var(--line));
  }
  .cal-day:hover{transform:translateY(-2px);box-shadow:var(--shadow-soft);}
  .tool-item:hover,.gl-item:hover,.material-item:hover,.resource-card:hover{
    transform:translateX(2px);
  }
  .concept-node:hover{transform:translateY(-2px) scale(1.015);}
}

/* Stable loading state: keep the button's dimensions and place spinner over it. */
.btn.is-loading,.btn[aria-busy="true"]{pointer-events:none;color:transparent!important;}
.btn.is-loading::after,.btn[aria-busy="true"]::after{
  content:"";position:absolute;left:50%;top:50%;width:17px;height:17px;
  margin:-9px 0 0 -9px;border:2px solid currentColor;
  border-right-color:transparent;border-radius:50%;
  color:var(--accent-ink);animation:ui-spin .72s linear infinite;
}
.btn:not(.primary).is-loading::after,.btn:not(.primary)[aria-busy="true"]::after{color:var(--accent);}
@keyframes ui-spin{to{transform:rotate(360deg)}}

/* Form controls: soft focus ring and clear checked feedback. */
.inp,.ta,.cb,.quiz-q input,.lib-sel{
  transition:border-color var(--motion-fast) var(--ease-soft),
    box-shadow var(--motion-base) var(--ease-out),
    background-color var(--motion-fast) var(--ease-soft),
    transform var(--motion-fast) var(--ease-spring);
}
.inp:focus-visible,.ta:focus-visible,select:focus-visible{
  outline:0;border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent);
}
.cb:checked{transform:scale(1.04);}
.cb:active{transform:scale(.92);}
input[type="radio"],input[type="checkbox"]{accent-color:var(--accent);}

/* Details-based dropdowns and dialogs. */
.navgrp>summary::before{transition:transform var(--motion-base) var(--ease-out);}
.navgrp[open]>summary::before{transform:rotate(90deg);}
details[open]>:not(summary){animation:dropdown-in 240ms var(--ease-out) both;}
@keyframes dropdown-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
dialog[open]{animation:dialog-in 260ms var(--ease-out) both;}
dialog[open]::backdrop{animation:backdrop-in 220ms var(--ease-soft) both;}
@keyframes dialog-in{from{opacity:0;transform:translateY(8px) scale(.975)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes backdrop-in{from{opacity:0}to{opacity:1}}

/* Optional lightweight tooltip: add data-tooltip="Підказка" to any control. */
[data-tooltip]{position:relative;}
[data-tooltip]::after{
  content:attr(data-tooltip);position:absolute;z-index:80;left:50%;bottom:calc(100% + 9px);
  width:max-content;max-width:min(260px,80vw);padding:7px 10px;border-radius:8px;
  background:var(--ink);color:var(--bg);font-size:.76rem;line-height:1.35;font-weight:500;
  white-space:normal;text-align:center;box-shadow:var(--shadow-soft);pointer-events:none;
  opacity:0;transform:translate(-50%,5px) scale(.97);
  transition:opacity var(--motion-fast) var(--ease-soft),transform var(--motion-base) var(--ease-out);
}
[data-tooltip]:hover::after,[data-tooltip]:focus-visible::after{opacity:1;transform:translate(-50%,0) scale(1);}

/* Scroll reveal is enabled by JS only after motion support is confirmed. */
.motion-enabled .reveal{
  opacity:0;transform:translateY(14px);
  transition:opacity 440ms var(--ease-out),transform 520ms var(--ease-out);
  transition-delay:var(--reveal-delay,0ms);
  will-change:opacity,transform;
}
.motion-enabled .reveal.is-visible{opacity:1;transform:translateY(0);will-change:auto;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;transition-delay:0ms!important;
  }
  .motion-enabled .reveal{opacity:1!important;transform:none!important;}
  .btn:active,.chip:active,.menu-btn:active,.close-btn:active,
  .btn:hover,.chip:hover,.menu-btn:hover,.close-btn:hover,.nav a:hover,
  .pn a:hover,.mstrip a:hover,.rc-title a:hover,.dlink:hover,
  .dc:hover,.stat-card:hover,.flashcard:hover,.case-card:hover,.today:hover,
  .weekly-review:hover,.cal-day:hover,.tool-item:hover,.gl-item:hover,
  .material-item:hover,.concept-node:hover{
    transform:none!important;box-shadow:none!important;
  }
  [data-tooltip]::after{display:none!important;}
}



/* ───────── Командна палітра, активність та аналітика ───────── */
.cmd-trigger{width:calc(100% - 20px);margin:8px 10px 2px;justify-content:space-between}
.cmd-trigger kbd,.cmd-hints kbd{font:inherit;font-size:.72rem;padding:2px 6px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface-2);color:var(--ink-2)}
#command-dialog{width:min(680px,calc(100% - 24px));padding:0;border:1px solid var(--line-strong);border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lift);overflow:hidden}
#command-dialog::backdrop{background:rgba(12,20,18,.48);backdrop-filter:blur(3px)}
.cmd-head{padding:18px;border-bottom:1px solid var(--line)}

.cmd-title-row h2{font-size:1.2rem}
.cmd-search-wrap{position:relative}
.cmd-search-wrap .inp{height:48px;padding-left:42px;font-size:1rem}
.cmd-search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:1.1rem}
.cmd-results{max-height:min(56vh,480px);overflow:auto;padding:8px}
.cmd-item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.cmd-item:hover,.cmd-item[aria-selected="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,var(--line))}
.cmd-item-icon{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:9px;background:var(--surface-2);color:var(--accent);font-size:1.05rem}
.cmd-item-main{min-width:0;flex:1;display:grid;gap:1px}
.cmd-item-main b{font-size:.93rem;font-weight:650;overflow-wrap:anywhere}
.cmd-item-main small{font-size:.78rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-kind{font-size:.72rem;color:var(--ink-2);white-space:nowrap}
.cmd-empty{padding:26px 14px;text-align:center;color:var(--ink-2)}
.cmd-hints{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:.76rem;color:var(--ink-2)}
.activity-card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px;min-width:0}
.activity-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.activity-months{display:grid;grid-auto-flow:column;grid-template-rows:1fr;gap:4px;margin:12px 0 5px 30px;width:max-content}
.activity-months span{font-size:.7rem;color:var(--ink-2);white-space:nowrap}
.activity-scroller{overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.activity-layout{display:grid;grid-template-columns:22px max-content;gap:8px;align-items:start;width:max-content;min-width:100%}
.activity-dows{display:grid;grid-template-rows:repeat(7,11px);gap:4px;padding-top:0}
.activity-dows span{font-size:.65rem;color:var(--ink-2);line-height:11px}
.activity-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:4px;width:max-content}
.activity-cell{appearance:none;width:11px;height:11px;min-width:11px;padding:0;border:1px solid var(--line);border-radius:3px;background:var(--surface-2);cursor:pointer}
.activity-cell[data-level="1"]{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-color:color-mix(in srgb,var(--accent) 28%,var(--line))}
.activity-cell[data-level="2"]{background:color-mix(in srgb,var(--accent) 42%,var(--surface));border-color:color-mix(in srgb,var(--accent) 42%,var(--line))}
.activity-cell[data-level="3"]{background:color-mix(in srgb,var(--accent) 68%,var(--surface));border-color:color-mix(in srgb,var(--accent) 68%,var(--line))}
.activity-cell[data-level="4"]{background:var(--accent);border-color:var(--accent)}
.activity-cell[aria-pressed="true"]{outline:2px solid var(--warm);outline-offset:2px}
.activity-cell:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.activity-legend{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--ink-2)}
.activity-legend .activity-cell{pointer-events:none;display:inline-block}
.activity-detail{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-top:12px;border-top:1px solid var(--line);font-size:.86rem;color:var(--ink-2)}
.activity-detail b{color:var(--ink)}
.analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.analytics-card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px;min-width:0}
.analytics-card h2{font-size:1.05rem;margin:0 0 4px}
.svg-chart{display:block;width:100%;height:auto;overflow:visible;margin-top:12px}
.svg-chart text{font-family:var(--font-body);fill:var(--ink-2);font-size:11px}
.svg-chart .chart-gridline{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.svg-chart .chart-bar{fill:var(--accent)}
.svg-chart .chart-line{fill:none;stroke:var(--warm);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.svg-chart .chart-point{fill:var(--surface);stroke:var(--warm);stroke-width:2.5}
.analytics-note{font-size:.8rem;color:var(--ink-2);margin-top:8px}
.pwa-panel{display:grid;gap:10px}
.pwa-status{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:.88rem;color:var(--ink-2)}
.pwa-actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:760px){.analytics-grid{grid-template-columns:minmax(0,1fr)}.cmd-hints{display:none}.activity-card{padding:14px}}

значає особистість","Після дитинства розвиток припиняється"],1,"Вікові закономірності є орієнтирами, а не жорстким календарем для кожної людини."]],[["Яка базова мета психологічного консультування?",["Поставити клієнту діагноз за однією розмовою","Допомогти дослідити запит, ресурси й можливі кроки в межах компетентності фахівця","Дати універсальну пораду замість клієнта","Гарантувати швидке усунення всіх труднощів"],1,"Консультування спрямоване на підтримку дослідження запиту й прийняття рішень, а не на гарантії чи директивні рішення."],["Що є прикладом активного слухання?",["Перебивати й одразу радити","Перефразувати почуте та перевірити, чи правильно зрозумів","Змінити тему на власний досвід","Оцінити, чи клієнт поводиться правильно"],1,"Перефразування, уточнення й відображення емоцій допомагають перевірити розуміння."],["Що означає емпатія в професійному контакті?",["Повністю погоджуватися з усім сказаним","Намагатися зрозуміти переживання іншого, не втрачаючи власної професійної позиції","Відчувати те саме, що й клієнт, у кожну мить","Брати відповідальність за всі рішення клієнта"],1,"Емпатія передбачає чутливе розуміння досвіду, але не обов’язково згоду."],["Яке запитання є відкритим?",["Ти прийшов учора?","Тобі було страшно: так чи ні?","Що для тебе було найскладнішим у цій ситуації?","Тобі 20 років?"],2,"Відкрите запитання запрошує розгорнути відповідь і описати власний досвід."],["Коли межі конфіденційності можуть мати винятки?",["Коли фахівцеві цікаво розповісти історію","Коли існує передбачена законом або професійними правилами підстава, наприклад серйозний ризик заподіяння шкоди","Коли клієнт не погоджується з порадою","Коли консультація була складною"],1,"Межі конфіденційності потрібно пояснити заздалегідь; конкретні винятки залежать від закону й професійних стандартів."]],[["Що означає біопсихосоціальна модель?",["Пояснення стану лише спадковістю","Розгляд взаємодії біологічних, психологічних і соціальних чинників","Пояснення всіх розладів лише вихованням","Поділ людей на три типи"],1,"Модель інтегрує кілька рівнів впливу, не зводячи складний стан до однієї причини."],["Чому поняття психологічної норми потребує контексту?",["Тому що не існує жодних закономірностей","Тому що оцінка враховує функціонування, страждання, культуру, ситуацію та індивідуальні особливості","Тому що будь-яка незвична поведінка є розладом","Тому що норма визначається популярністю"],1,"Норма не зводиться до статистичної поширеності або відповідності очікуванням."],["Що є доречним завданням клінічного інтерв’ю?",["Зібрати систематичну інформацію про скарги, контекст, історію та ресурси","Підтвердити перше припущення будь-якою ціною","Замінити всі інші методи оцінки","Поставити діагноз без уточнень"],0,"Інтерв’ю допомагає сформувати попереднє розуміння й визначити, яких даних бракує."],["Що означає валідність психологічного тесту?",["Він завжди дає однаковий бал усім","Він вимірює саме той конструкт, для оцінки якого призначений, у заданих умовах","Він має багато запитань","Його легко пройти"],1,"Валідність стосується обґрунтованості інтерпретацій тестових результатів."],["Що робить фахівець, коли запит виходить за межі його компетентності?",["Імпровізує","Приховує обмеження","Обговорює межі, консультується або скеровує до відповідного спеціаліста","Продовжує роботу без змін"],2,"Визнання меж компетентності — частина безпечної та етичної практики."]],[["Що таке депресивний епізод у клінічному контексті?",["Короткий сум після неприємної події","Стійкий комплекс симптомів, що оцінюється з урахуванням тривалості, інтенсивності й порушення функціонування","Будь-яка втома","Відсутність бажання працювати один день"],1,"Клінічна оцінка враховує комплекс симптомів, час, функціонування й альтернативні пояснення."],["Яка ознака часто характерна для панічної атаки?",["Раптовий сплеск інтенсивного страху або дискомфорту з тілесними й когнітивними симптомами","Поступове зниження зросту","Постійна втрата пам’яті","Виключно підвищений апетит"],0,"Панічна атака — інтенсивний епізод страху/дискомфорту; сама по собі не дорівнює панічному розладу."],["Що є характерним для ОКР?",["Лише любов до порядку","Обсесії та/або компульсії, які спричиняють значний дистрес або порушують функціонування","Будь-які повторювані звички","Бажання планувати день"],1,"ОКР включає нав’язливі думки/образи/імпульси та/або повторювані дії чи ментальні ритуали."],["Що важливо врахувати при ПТСР?",["Будь-яку неприємну згадку","Експозицію травматичній події, характерний комплекс симптомів, тривалість і вплив на функціонування","Лише інтенсивність одного спогаду","Тільки фізичний біль"],1,"ПТСР оцінюють за визначеними критеріями, контекстом травми й диференційною оцінкою."],["Чому не можна ставити діагноз за одним симптомом або тестом з інтернету?",["Тести завжди помилкові","Симптоми перетинаються між станами, а діагностика потребує повної оцінки та професійної компетентності","Діагнози не існують","Достатньо знати вік людини"],1,"Окремий симптом має багато можливих причин; діагностичне рішення не роблять за одним пунктом."]],[["На чому насамперед зосереджується КПТ?",["На зв’язках між думками, емоціями, тілесними реакціями й поведінкою та їх перевірці","Лише на дитячих спогадах","На тлумаченні сновидінь як єдиному методі","На усуненні всіх негативних емоцій"],0,"КПТ досліджує взаємопов’язані когнітивні, емоційні, фізіологічні та поведінкові процеси."],["Що є ключовим для психодинамічної терапії?",["Дослідження несвідомих процесів, повторюваних патернів і стосунків","Виключно домашні завдання на активність","Тільки тренування уваги","Підрахунок часу сну"],0,"Психодинамічні підходи різняться, але часто досліджують несвідомі конфлікти, захисти й реляційні патерни."],["Що підкреслює клієнт-центрований підхід Карла Роджерса?",["Безумовне позитивне ставлення, емпатію та конгруентність терапевта","Директивне нав’язування рішень","Інтерпретацію кожної паузи","Формальне тестування замість контакту"],0,"Роджерс описав умови терапевтичного контакту, які підтримують дослідження досвіду й особистісні зміни."],["Що є характерною особливістю системної сімейної терапії?",["Розгляд людини ізольовано від її стосунків","Аналіз взаємодій, правил і циклів комунікації у системі стосунків","Пошук однієї винної людини","Відмова від контексту сім’ї"],1,"Системні підходи аналізують повторювані взаємодії та контекст, а не шукають одного винуватця."],["Як найкраще порівнювати психотерапевтичні підходи?",["За популярністю в соцмережах","За теоретичними припущеннями, доказами для конкретного запиту, компетентністю фахівця й уподобаннями клієнта","За кількістю термінів","Визначити один підхід найкращим для всіх"],1,"Доречність підходу залежить від проблеми, доказів, контексту та якості терапевтичної взаємодії."]],[["Що таке автоматична думка в КПТ?",["Миттєва інтерпретація ситуації, яка може з’являтися без свідомого зусилля","Будь-який факт про світ","Думка, яку людина обов’язково промовляє вголос","Довгострокова ціль"],0,"Автоматичні думки часто короткі й правдоподібні для людини в конкретній ситуації."],["Який приклад когнітивного викривлення «катастрофізація»?",["Оцінити ймовірність кількох результатів","Передбачити найгірший результат і сприйняти його як майже неминучий","Знайти факти за й проти думки","Визнати невизначеність"],1,"Катастрофізація перебільшує ймовірність або наслідки негативного сценарію."],["Для чого в КПТ використовують поведінковий експеримент?",["Щоб довести терапевту власну правоту","Щоб перевірити конкретне переконання через заздалегідь сплановане спостереження або дію","Щоб уникнути дискомфорту назавжди","Щоб замінити формулювання випадку"],1,"Поведінковий експеримент — спосіб зібрати дані щодо прогнозу, а не просто переконувати себе."],["Що є глибинним переконанням?",["Ситуативна думка про сьогоднішню погоду","Більш узагальнене стійке уявлення про себе, інших або світ","Окремий фізіологічний симптом","Завжди свідоме рішення"],1,"Глибинні переконання формують широкі правила інтерпретації досвіду."],["Що має містити концептуалізація випадку?",["Остаточний ярлик без перевірки","Робочу гіпотезу про проблему, чинники вразливості, тригери, підтримувальні механізми й ресурси","Лише перелік симптомів","Особисту думку фахівця без даних"],1,"Концептуалізація — гнучка перевірювана карта для планування допомоги, а не незмінна істина."]],[["Що таке детермінізм у філософії?",["Теза, що події мають причини або зумовленості","Твердження, що нічого не має причин","Відмова від логіки","Віра, що всі вибори випадкові"],0,"Детермінізм стверджує причинну зумовленість подій; різні версії по-різному трактують свободу."],["Що означає екзистенційна тривога?",["Лише страх перед іспитом","Тривога, пов’язана з фундаментальними умовами існування: свободою, скінченністю, невизначеністю, ізоляцією","Ознака одного конкретного діагнозу","Реакція тільки на фізичну небезпеку"],1,"Екзистенційна тривога — філософсько-психологічне поняття, а не самостійний діагноз."],["Як розуміти автентичність у філософському контексті?",["Постійно робити все, чого хочеться","Усвідомлено співвідносити вибір і дії з власними цінностями та відповідальністю","Ігнорувати інших людей","Ніколи не змінювати думку"],1,"Автентичність не означає імпульсивність; вона пов’язана з усвідомленістю та відповідальністю за вибір."],["Чим філософське питання про сенс відрізняється від емпіричного психологічного питання?",["Воно не може бути осмисленим","Філософське питання досліджує значення й підстави, емпіричне — спостережувані закономірності досвіду","Психологія не вивчає сенс","Вони завжди тотожні"],1,"Рівні запитань можуть перетинатися, але потребують різних методів аргументації."],["Яка позиція є обережною при обговоренні страху смерті?",["Приписати всім однаковий досвід","Враховувати індивідуальний, культурний і життєвий контекст та не патологізувати сам факт роздумів про смерть","Уникати теми за будь-яких обставин","Вважати страх доказом розладу"],1,"Роздуми про скінченність — частина людського досвіду; значення залежить від контексту та функціонування."]],[["Для чого формулюють дослідницьку гіпотезу?",["Щоб заздалегідь оголосити результат істинним","Щоб сформулювати перевірюване передбачення про зв’язок або відмінність","Щоб уникнути визначення змінних","Щоб замінити аналіз даних"],1,"Гіпотеза має бути достатньо конкретною, щоб її можна було перевірити даними."],["Що дозволяє рандомізація в експерименті?",["Гарантує відсутність усіх похибок","У середньому допомагає зрівняти групи за відомими й невідомими чинниками","Збільшує вибірку автоматично","Доводить, що вибірка репрезентативна"],1,"Випадковий розподіл підтримує причинні висновки, але не вирішує всіх проблем дизайну."],["Який висновок допустимий, якщо дві змінні корелюють?",["Перша обов’язково спричиняє другу","Між ними є статистичний зв’язок у цих даних; можливі інші пояснення","Жодна змінна не має значення","Зв’язок гарантовано діє для всіх людей"],1,"Можливі зворотна причинність, третя змінна, випадковість або обмеження вибірки."],["Що характеризує репрезентативну вибірку?",["Вона обов’язково дуже велика","Її склад і спосіб відбору дозволяють обґрунтовано переносити висновки на визначену популяцію","У ній лише добровольці-друзі дослідника","Вона гарантує причинність"],1,"Репрезентативність залежить від цільової популяції та процедури відбору, а не лише від розміру."],["Чим метааналіз відрізняється від систематичного огляду?",["Метааналіз завжди є окремим експериментом","Метааналіз статистично об’єднує результати сумісних досліджень; систематичний огляд прозоро відбирає й синтезує докази","Систематичний огляд не має методів","Це точні синоніми"],1,"Метааналіз може бути частиною систематичного огляду, якщо дані достатньо зіставні."]],[["Що передбачає інформована згода?",["Підпис без пояснень","Добровільне рішення після зрозумілого пояснення цілей, процедур, ризиків, альтернатив і прав учасника/клієнта","Згоду лише родича повнолітньої людини","Автоматичну згоду через запис на прийом"],1,"Згода має бути поінформованою, добровільною та відкличною в межах застосовних правил."],["Що є етичним поводженням із конфіденційною інформацією?",["Обговорювати випадок із друзями без імені, навіть якщо людину легко впізнати","Збирати й поширювати лише необхідну інформацію, захищати записи та пояснювати обмеження конфіденційності","Зберігати записи у відкритому доступі","Ділитися деталями заради цікавого прикладу"],1,"Знеособлення має бути реальним; дані слід захищати та використовувати лише з належною підставою."],["Що робити, якщо запит виходить за межі професійної компетентності?",["Прийняти його, аби не втратити клієнта","Відверто обговорити межі, звернутися по супервізію або скерувати до компетентного фахівця","Спробувати випадкову техніку","Приховати проблему"],1,"Компетентність включає усвідомлення власних меж і належне скерування."],["Для чого потрібна супервізія?",["Щоб супервізор ухвалював усі рішення замість фахівця","Для професійного осмислення практики, етичних дилем, ризиків і розвитку компетентності","Лише для отримання сертифіката","Щоб обговорювати клієнтів без правил конфіденційності"],1,"Супервізія підтримує якість практики, рефлексію та відповідальність."],["Що означає інтегративне пояснення поведінки?",["Звести поведінку лише до характеру","Поєднати біологічні, психологічні й соціальні фактори та перевіряти їхню роль у конкретному контексті","Вважати всі теорії однаково правильними","Не враховувати дані"],1,"Інтеграція не означає змішування всього підряд: важливо визначити рівні, докази й межі кожного пояснення."]]];

function recentAnalyticsWeeks(){
  var today=dayStart(new Date()),monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));var out=[];
  for(var i=7;i>=0;i--){var start=new Date(monday);start.setDate(monday.getDate()-i*7);var minutes=0;for(var d=0;d<7;d++){var dt=new Date(start);dt.setDate(start.getDate()+d);minutes+=(+S.days[iso(dt)]||0)}out.push({start:start,minutes:minutes,topics:0,materials:0,cumulative:0})}
  var events=[],base=0,firstTime=out[0].start.getTime(),lastTime=new Date(monday);lastTime.setDate(monday.getDate()+7);lastTime=lastTime.getTime();
  Object.keys(S.topicHistory||{}).forEach(function(k){var t=+S.topicHistory[k];if(t)events.push({time:t})});
  allResources(true).forEach(function(r){var st=getResourceState(r.id);if(st.status==='Опрацьовано'&&+st.updatedAt)events.push({time:+st.updatedAt,resource:true})});
  events.forEach(function(e){if(e.time<firstTime)base++;else if(e.time>=firstTime&&e.time<lastTime){var ix=Math.floor((e.time-firstTime)/604800000);if(out[ix]){if(e.resource)out[ix].materials++;else out[ix].topics++}}});
  var cumulative=base;out.forEach(function(w){cumulative+=w.topics+w.materials;w.cumulative=cumulative});return out;
}
function studySvgHTML(series){

function polar(cx,cy,r,deg){var a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function sector(cx,cy,ri,ro,a0,a1){
  var p1=polar(cx,cy,ro,a0),p2=polar(cx,cy,ro,a1),p3=polar(cx,cy,ri,a1),p4=polar(cx,cy,ri,a0),f=function(p){return p[0].toFixed(2)+' '+p[1].toFixed(2)};
  return 'M'+f(p1)+' A'+ro+' '+ro+' 0 0 1 '+f(p2)+' L'+f(p3)+' A'+ri+' '+ri+' 0 0 0 '+f(p4)+' Z';
}
function ringHTML(){
  var cx=170,cy=170,r0=58,r1=124,cur=scheduleModule(),dn=doneCount(),h='';

    var lp=polar(cx,cy,r1+17,mid);

    if(n===cur)h+='<path class="c" d="'+sector(cx,cy,r0-3,r1+3,a0-.6,a1+.6)+'"/>';
    h+='<path class="c2" d="'+sector(cx,cy,r0,r1,a0,a1)+'"/>';
    h+='<text class="rn'+(n===cur?' cur':'')+'" x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'">'+n+'</text></a>';
  }
  h+='<text class="big" x="170" y="160">'+dn+'</text><text class="cap" x="170" y="190">з 12 модулів</text></svg>';

var F={dur:1500,left:1500,phase:'focus',running:false,endAt:0,tick:null};
function focusBell(){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var c=new AC(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.045;o.start();o.stop(c.currentTime+.18);o.onended=function(){c.close()}}catch(e){}}
function focusTick(){F.left=Math.max(0,Math.round((F.endAt-Date.now())/1000));var el=$('#focus-time');if(el)el.textContent=fmtClock(F.left);var phase=$('#focus-phase');if(phase)phase.textContent=F.phase==='focus'?'Час зосередження':'Коротка перерва';if(F.left<=0){F.running=false;clearInterval(F.tick);F.tick=null;focusBell();if(F.phase==='focus'){var mins=Math.round(F.dur/60);addMinutes(mins,'focus-'+Date.now());F.phase='break';F.dur=300;F.left=300;toast('Фокус завершено: '+mins+' хв зараховано. Час на перерву!');celebrate()}else{F.phase='focus';F.dur=1500;F.left=1500;toast('Перерва завершена. Готовий до наступного раунду?')}if(route()==='focus')render()}}
function focusAction(a){if(a==='focus-start'){if(F.left<=0)F.left=F.dur;F.running=true;F.endAt=Date.now()+F.left*1000;clearInterval(F.tick);F.tick=setInterval(focusTick,250)}else if(a==='focus-pause'){focusTick();F.running=false;clearInterval(F.tick);F.tick=null}else if(a==='focus-reset'){F.running=false;clearInterval(F.tick);F.tick=null;F.phase='focus';F.dur=1500;F.left=1500}else if(a==='focus-skip'){F.running=false;clearInterval(F.tick);F.tick=null;if(F.phase==='focus'){F.phase='break';F.dur=300;F.left=300}else{F.phase='focus';F.dur=1500;F.left=1500}}render()}

/* ───────── Тиждень і таймер ───────── */
var T={dur:25*60,left:25*60,running:false,endAt:0,done:false,tick:null,credited:0};
function fmtClock(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function updatePill(){
  var show=T.running||(T.left<T.dur&&!T.done);
  document.querySelectorAll('.pill').forEach(function(p){p.hidden=!show;p.textContent='Таймер '+fmtClock(T.left)});
  var el=$('#tm-time');if(el)el.textContent=fmtClock(T.left);
}
function timerTick(){
  var left=Math.max(0,Math.round((T.endAt-Date.now())/1000));
  T.left=left;
  if(left<=0){
    T.running=false;T.done=true;clearInterval(T.tick);T.tick=null;
    addMinutes(Math.round(T.dur/60),'timer-'+Date.now());
    toast('Зараховано '+Math.round(T.dur/60)+' хв');
    T.credited=0;
    if(route()==='week')render();
  }
  updatePill();
}
function addMinutes(m,sessionId){
  if(m<=0)return;var k=iso(new Date());
  mutate(function(s){s.days[k]=(+s.days[k]||0)+m;grantXP(s,'study-'+(sessionId||Date.now()),Math.max(1,Math.floor(m/5)))},false);
}
function timerAction(a,val){
  if(a==='tm-dur'&&!T.running){T.dur=val*60;T.left=T.dur;T.done=false}
  else if(a==='tm-start'){
    if(T.done||T.left<=0){T.left=T.dur;T.done=false}
    T.running=true;T.endAt=Date.now()+T.left*1000;
    clearInterval(T.tick);T.tick=setInterval(timerTick,250);
  }else if(a==='tm-pause'){
    timerTick();T.running=false;clearInterval(T.tick);T.tick=null;
  }else if(a==='tm-reset'){
    T.running=false;clearInterval(T.tick);T.tick=null;T.left=T.dur;T.done=false;
  }else if(a==='tm-credit'){
    if(T.running){timerTick();T.running=false;clearInterval(T.tick);T.tick=null}
    var m=Math.floor((T.dur-T.left)/60);
    if(m>=1){addMinutes(m,'timer-credit-'+Date.now());toast('Зараховано '+m+' хв')}else toast('Поки менше хвилини, нічого зараховувати');
    T.left=T.dur;T.done=false;
  }
  render();
}

  else if(a==='start'){if(el.value)mutate(function(s){s.start=el.value})}
  else if(a==='day'){var v=Math.max(0,Math.min(600,Math.round(+el.value||0))),k=el.dataset.d;mutate(function(s){if(v)s.days[k]=v;else delete s.days[k]})}
  else if(el.id==='lib-type'||el.id==='lib-status'||el.id==='lib-module'){el.dispatchEvent(new Event('input',{bubbles:true}))}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='cmd-q'){renderCommandResults(el.value);return}
  if(el.id==='gl-q'){$('#gl-list').innerHTML=glListHTML(el.value);return}
  if(el.id&&el.id.indexOf('lib-')===0&&el.id!=='lib-count'){refreshLib();return}
  var b=el.dataset&&el.dataset.bind;if(!b)return;
  var k=el.dataset.k;
  mutate(function(s){
    if(b==='courseNotes'){s.courseNotes=el.value}
    else if(b==='focusTask'){s.focusTask=el.value}
    else if(b==='resourceNotes'){if(!s.resourceStates[k])s.resourceStates[k]={status:'Заплановано',note:'',updatedAt:0};s.resourceStates[k].note=el.value}
    else if(b==='weeklyQuestions'){if(!s.weeklyQuestions)s.weeklyQuestions={};if(el.value)s.weeklyQuestions[k]=el.value;else delete s.weeklyQuestions[k]}
    else if(el.value){if(!s[b])s[b]={};s[b][k]=el.value}
    else if(s[b])delete s[b][k];
  },false);
  grow(el);
  var wc=document.querySelector('[data-wc="'+(b==='work'?'work-':b==='topicNotes'?'topicNotes-':b==='courseNotes'?'courseNotes-':'notes-')+k+'"]');
  if(wc)wc.textContent=words(el.value)+' слів';
  if(b==='q'){var n=+k;$('#finish').innerHTML=finishHTML(n);renderNav()}
});
document.addEventListener('submit',function(e){
  var form=e.target;
  if(form.dataset.form==='topic-material'||form.dataset.form==='material'){
    e.preventDefault();var fd=new FormData(form),n=+form.dataset.m,title=String(fd.get('title')||'').trim(),url=String(fd.get('url')||'').trim(),type=String(fd.get('type')||'Матеріал'),desc=String(fd.get('desc')||'').trim();
    try{var parsed=new URL(url);if(!/^https?:$/.test(parsed.protocol))throw new Error('protocol')}catch(err){toast('Вкажи коректне посилання з https:// або http://');return}
    if(!title)return;var id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),topic=form.dataset.topic;
    mutate(function(s){if(topic){if(!Array.isArray(s.topicMaterials[topic]))s.topicMaterials[topic]=[];s.topicMaterials[topic].push({id:id,title:title,url:url,type:type,desc:desc,dateAdded:iso(new Date())})}else{if(!Array.isArray(s.materials[n]))s.materials[n]=[];s.materials[n].push({id:id,title:title,url:url,type:type,desc:desc,dateAdded:iso(new Date())})}});
    if(topic){var td=document.querySelector('details[data-topic-open="'+topic+'"]');if(td)td.open=true}
    toast('Матеріал додано');return;
  }
  if(form.dataset.form==='quiz'){
    e.preventDefault();var fdq=new FormData(form),nq=+form.dataset.m,choices=[0,1,2,3].map(function(i){return String(fdq.get('choice'+i)||'').trim()});
    if(choices.some(function(x){return !x})){toast('Заповни всі чотири варіанти');return}
    var qid='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);mutate(function(s){if(!Array.isArray(s.quiz[nq]))s.quiz[nq]=[];s.quiz[nq].push({id:qid,question:String(fdq.get('question')||'').trim(),choices:choices,answer:+fdq.get('answer'),explanation:String(fdq.get('explanation')||'').trim()})});var qa=document.querySelector('details.quiz-author');if(qa)qa.open=true;toast('Питання додано');return;
  }
  if(form.dataset.form==='card'){
    e.preventDefault();var fdc=new FormData(form),front=String(fdc.get('front')||'').trim(),back=String(fdc.get('back')||'').trim();if(!front||!back)return;mutate(function(s){s.cards.push({id:'c'+Date.now().toString(36),front:front,back:back,module:+fdc.get('module')||0,known:false})});toast('Картку створено');return;
  }
  if(form.dataset.form==='task'){
    e.preventDefault();var fdt=new FormData(form),nt=+form.dataset.m;mutate(function(s){if(!Array.isArray(s.tasks[nt]))s.tasks[nt]=[];s.tasks[nt].push({id:'t'+Date.now().toString(36),title:String(fdt.get('title')||'').trim(),desc:String(fdt.get('desc')||'').trim(),done:false})});toast('Завдання додано');return;
  }
  if(form.dataset.form==='research'){
    e.preventDefault();var fdr=new FormData(form),ru=String(fdr.get('url')||'').trim();if(ru){try{if(!/^https?:$/.test(new URL(ru).protocol))throw 0}catch(err){toast('Перевір посилання на дослідження');return}}
    var rr={id:'r'+Date.now().toString(36),title:String(fdr.get('title')||'').trim(),url:ru,module:+fdr.get('module')||0,question:String(fdr.get('question')||''),sample:String(fdr.get('sample')||''),method:String(fdr.get('method')||''),results:String(fdr.get('results')||''),limits:String(fdr.get('limits')||''),assessment:String(fdr.get('assessment')||''),date:iso(new Date())};mutate(function(s){s.research.push(rr)});toast('Аналіз збережено');return;
  }
  if(form.dataset.form==='concept'){
    e.preventDefault();var fdcpt=new FormData(form);mutate(function(s){s.concepts.push({id:'cpt'+Date.now().toString(36),a:String(fdcpt.get('a')||'').trim(),relation:String(fdcpt.get('relation')||'').trim(),b:String(fdcpt.get('b')||'').trim(),module:+fdcpt.get('module')||0,note:String(fdcpt.get('note')||'').trim()})});toast('Зв’язок додано');return;
  }
  if(form.dataset.form==='event'){
    e.preventDefault();var fde=new FormData(form);mutate(function(s){s.events.push({id:'e'+Date.now().toString(36),date:String(fde.get('date')||CAL_SELECTED),title:String(fde.get('title')||'').trim(),module:+fde.get('module')||0,note:String(fde.get('note')||'').trim(),done:false})});toast('Подію додано');return;
  }
  if(e.target.id!=='gl-form')return;
  e.preventDefault();
  var t=$('#gl-t').value.trim(),d=$('#gl-d').value.trim(),m=+$('#gl-m').value||0;
  if(!t||!d)return;
  var id='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  mutate(function(s){s.gl.push({id:id,t:t,d:d,m:m})});
  toast('Термін додано');
  var f=$('#gl-t');if(f)f.focus();
});

/* ───────── Хмарне збереження ───────── */
async function initCloud(){
  var ok=false;
  try{
    if(window.claude&&window.claude.use){
      var res=await Promise.all([claude.use('db'),claude.use('user')]);
      var dbn=res[0],usr=res[1],id=usr?await usr.id():null;
      if(dbn&&id){
        ref=dbn.doc('data/users/'+id+'/state');ok=true;
        var slow=setTimeout(function(){setSync('slow')},10000);
        ref.onSnapshot(function(snap){
          if(snap.metadata.hasPendingWrites)return;
          if(!snap.metadata.fromCache){clearTimeout(slow);setSync(saving||dirty?'saving':'cloud')}
          if(!snap.exists){
            if(!snap.metadata.fromCache){ensureStarted();scheduleSave()}
            return;
          }
          var d=snap.data()||{},remote=+d.updatedAt||0;
          if(remote>(S.updatedAt||0)){
            S=norm(JSON.parse(JSON.stringify(d)));saveLocal();
            var ae=document.activeElement;
            if(!(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')))render();else renderNav();
          }else if(remote<(S.updatedAt||0)&&!saving&&!dirty&&!snap.metadata.fromCache){scheduleSave()}
        },function(){clearTimeout(slow);setSync('local')});
      }
    }
  }catch(err){}
  if(!ok){ensureStarted();setSync('local')}
}

render();
initPWA();
refreshPWAStatus();
initCloud();
})();
